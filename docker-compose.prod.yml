services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes: [postgres_prod:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_prod:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 10}
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes: [static_prod:/app/staticfiles, media_prod:/app/media]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  celery_worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    command: celery -A config worker -l info
    volumes: [media_prod:/app/media]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  celery_beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  frontend:
    build: ./frontend
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro, static_prod:/srv/static:ro, media_prod:/srv/media:ro, ./deploy/certs:/etc/nginx/certs:ro]
    depends_on: [backend,frontend]
volumes: {postgres_prod: {}, redis_prod: {}, static_prod: {}, media_prod: {}}
