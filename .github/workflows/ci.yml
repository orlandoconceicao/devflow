name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_DB: devflow_test,
            POSTGRES_USER: devflow,
            POSTGRES_PASSWORD: test-only,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DEBUG: "True"
      SECRET_KEY: ci-test-key-not-for-production
      DB_NAME: devflow_test
      DB_USER: devflow
      DB_PASSWORD: test-only
      DB_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: coverage run backend/manage.py test
      - run: coverage report --fail-under=55
      - run: pip-audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
