[tool.ruff]
target-version = "py313"
line-length = 88

[tool.black]
line-length = 88
target-version = ["py313"]
exclude = "(frontend|node_modules|dist|media|staticfiles)"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]

[tool.ruff.lint.per-file-ignores]
"backend/**/migrations/*.py" = ["I001"]

[tool.coverage.run]
source = ["backend/apps"]
omit = ["*/migrations/*", "*/tests.py", "*/admin.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
