services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-devflow}
      POSTGRES_USER: ${DB_USER:-devflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devflow-local-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: {context: ./backend, dockerfile: Dockerfile.dev}
    command: sh -c "python manage.py migrate && python manage.py seed_plans && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-devflow}
      DB_USER: ${DB_USER:-devflow}
      DB_PASSWORD: ${DB_PASSWORD:-devflow-local-only}
      REDIS_URL: redis://redis:6379/0
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes: ["./backend:/app", "task_media:/app/media"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  celery_worker:
    build: {context: ./backend, dockerfile: Dockerfile.dev}
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-devflow}
      DB_USER: ${DB_USER:-devflow}
      DB_PASSWORD: ${DB_PASSWORD:-devflow-local-only}
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app", "task_media:/app/media"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  celery_beat:
    build: {context: ./backend, dockerfile: Dockerfile.dev}
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-devflow}
      DB_USER: ${DB_USER:-devflow}
      DB_PASSWORD: ${DB_PASSWORD:-devflow-local-only}
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app"]
    depends_on:
      redis: {condition: service_healthy}
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile.dev}
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_PROXY_TARGET: http://backend:8000
    ports: ["${FRONTEND_PORT:-5173}:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  task_media:
  redis_data:
