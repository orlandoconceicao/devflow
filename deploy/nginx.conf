map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80; server_name ${DOMAIN}; return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2; server_name ${DOMAIN};
  ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;
  client_max_body_size 10m;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-ID $request_id; }
  location /health/ { proxy_pass http://backend:8000; }
  location /ws/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
  location /static/ { alias /srv/static/; }
  location /media/ { internal; alias /srv/media/; }
  location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}
